plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simpleai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.simpleai.app'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.0.5'
    }
}

dependencies {
    // Local on-device text generation using a MediaPipe-compatible .task model.
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
}
